[package]
name = "snake-backend"
version = "0.1.0"
edition = "2021"

[lib]
name = "snake_backend"
path = "src/lib.rs"

[[bin]]
name = "snake-backend"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "sqlite",
    "postgres",
    "any",
    "json",
    "macros",
    "migrate",
] }
time = { version = "0.3", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
hex = "0.4"
pbkdf2 = "0.12"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
thiserror = "2"
anyhow = "1"
dotenvy = "0.15"
futures-util = "0.3"

[dev-dependencies]
axum-test = "20"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
